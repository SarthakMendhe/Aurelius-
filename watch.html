<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>AURELIUS Timepiece</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"/>
<link rel="stylesheet" href="styles.css"/>
<style>
.reveal{opacity:0;transform:translateY(40px);transition:opacity 1.1s cubic-bezier(.22,1,.36,1),transform 1.1s cubic-bezier(.22,1,.36,1)}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
<header class="nav"><div class="glass"><div class="container nav-inner">
  <a href="index.html" class="logo">AURELIUS</a>
  <a href="index.html" class="luxe2 cream">← Maison</a>
</div></div></header>
<main id="main"></main>
<footer><div class="container copy">© 2026 Maison Aurelius · Genève</div></footer>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('slug') || 'royal';
const w = getWatch(slug);
const main = document.getElementById('main');
if(!w){
  main.innerHTML = `<div style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center">
    <div><p class="luxe gold">Not Found</p><h1 class="serif" style="font-size:2.5rem;margin:1rem 0">This timepiece does not exist.</h1>
    <a href="index.html" class="link-underline">Return to the Maison</a></div></div>`;
} else {
  document.title = `${w.ref} — ${w.name} | AURELIUS`;
  main.innerHTML = `
    <section class="hero detail-hero">
      <div class="hero-bg" data-parallax><img src="${w.image}" alt="${w.name}"/></div>
      <div class="vignette" style="position:absolute;inset:0;z-index:1"></div>
      <div class="hero-content" data-parallax-fade>
        <p class="luxe gold" style="margin-bottom:2rem">${w.tag} · Reference</p>
        <h1 class="gold-text serif">${w.ref}</h1>
        <p class="luxe2 cream" style="margin-top:2.5rem">${w.tagline}</p>
        <p class="muted" style="margin-top:1.5rem;font-style:italic;max-width:36rem;font-size:1.1rem">${w.description}</p>
        <a href="#showcase" class="link-underline" style="margin-top:3.5rem">Discover the Timepiece <span class="arrow">→</span></a>
      </div>
    </section>

    <section id="showcase" class="section bg-bg">
      <div class="container">
        <div class="center reveal"><p class="label luxe">— The Timepiece</p>
          <h2 class="serif">${w.story}</h2></div>
        <div class="reveal" style="position:relative;aspect-ratio:16/10;overflow:hidden">
          <img src="${w.image}" alt="${w.name}" style="width:100%;height:100%;object-fit:cover"/>
        </div>
        <div class="spec-grid" style="margin-top:3.5rem">
          ${["Hand-finished movement","Crafted in finest materials","Engineered with precision"].map(c=>`
            <div class="spec reveal" style="text-align:center"><p class="luxe gold" style="margin-bottom:1rem">— Caption</p><p class="serif" style="font-size:1.5rem;color:var(--cream)">${c}</p></div>`).join("")}
        </div>
      </div>
    </section>

    <section class="section bg-onyx">
      <div class="container two">
        <div class="reveal frame"><img src="${w.movement}" alt="Movement detail"/></div>
        <div class="reveal">
          <p class="label luxe">— Movement &amp; Engineering</p>
          <h2 class="serif">The art of <em class="gold-text">precision</em>.</h2>
          <div class="hairline"></div>
          <p class="muted" style="font-size:1.1rem">${w.movementStory}</p>
        </div>
      </div>
    </section>

    <section class="section bg-bg">
      <div class="container">
        <div class="center reveal"><p class="label luxe">— Complications</p><h2 class="serif">Six expressions of mastery.</h2></div>
        <div class="hl-grid">
          ${w.highlights.map((h,i)=>`<div class="hl glass reveal"><p class="luxe gold">0${i+1}</p><h3 class="serif">${h.title}</h3><p>${h.desc}</p></div>`).join("")}
        </div>
      </div>
    </section>

    <section class="section bg-onyx">
      <div class="container two">
        <div class="reveal">
          <p class="label luxe">— The Dial</p>
          <h2 class="serif">Composed in <em class="gold-text">light</em>.</h2>
          <div class="hairline"></div>
          ${w.dial.map(d=>`<div class="bullet">${d}</div>`).join("")}
        </div>
        <div class="reveal frame" style="aspect-ratio:1/1"><img src="${w.macro}" alt="Dial macro"/></div>
      </div>
    </section>

    <section class="section bg-bg">
      <div class="container two">
        <div class="reveal frame"><img src="${w.caseStrap}" alt="Case and strap"/></div>
        <div class="reveal">
          <p class="label luxe">— Case &amp; Strap</p>
          <h2 class="serif">Carved with <em class="gold-text">intention</em>.</h2>
          <div class="hairline"></div>
          <p class="muted" style="font-size:1.1rem;margin-bottom:2.5rem">${w.caseStory}</p>
          ${w.caseDetails.map(d=>`<div class="bullet">${d}</div>`).join("")}
        </div>
      </div>
    </section>

    <section class="section bg-onyx">
      <div class="container" style="max-width:1200px">
        <div class="center reveal"><p class="label luxe">— Specifications</p><h2 class="serif">Technical excellence, in detail.</h2></div>
        <div class="reveal spec-grid">
          ${w.specs.map(([l,v])=>`<div class="spec"><p class="l">${l}</p><p class="v">${v}</p></div>`).join("")}
        </div>
      </div>
    </section>

    <section id="acquire" class="section bg-bg">
      <div class="container two">
        <div class="reveal frame" style="aspect-ratio:1/1"><img src="${w.image}" alt="${w.name}"/></div>
        <div class="reveal">
          <p class="label luxe">— Acquire</p>
          <h2 class="serif">Reserve the <em class="gold-text">${w.ref}</em>.</h2>
          <div class="hairline"></div>
          <p class="luxe muted" style="margin-bottom:.75rem">Recommended Retail</p>
          <p class="price-big gold-text">${w.price}</p>
          <p class="muted" style="font-style:italic;margin-bottom:2rem">${w.availability}</p>
          <div class="trust">
            <div><span class="dot"></span> Lifetime Warranty</div>
            <div><span class="dot"></span> Authenticity Certified</div>
            <div><span class="dot"></span> Insured Worldwide Delivery</div>
            <div><span class="dot"></span> Private Atelier Visit</div>
          </div>
          <div class="acquire-actions">
            <a href="checkout.html?slug=${w.slug}" class="btn btn-gold">Acquire This Timepiece →</a>
            <a href="#" class="btn btn-outline">Request a Private Viewing</a>
          </div>
          <p class="luxe2 muted" style="margin-top:2rem">Contact concierge · +41 22 707 30 10</p>
        </div>
      </div>
    </section>

    <section class="legacy">
      <div class="reveal">
        <p class="label luxe" style="margin-bottom:2.5rem">— Legacy</p>
        <blockquote><span class="qmark serif">“</span>A watch is not merely time.<br/>It is a <em class="gold-text">legacy</em><br/>preserved forever.</blockquote>
      </div>
    </section>
  `;
  document.querySelectorAll('.reveal').forEach(el=>{
    new IntersectionObserver((e,o)=>{e.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');o.unobserve(en.target)}})},{rootMargin:"-80px"}).observe(el);
  });
}
</script>
</body>
</html>
